# ============================================================
# PRODUCTION REFERENCE — near-verbatim copy of the droplet's :443 vhost
# (ServerAdmin genericized; no secrets). Live path:
# /etc/apache2/sites-available/isitbensbirthday.com-le-ssl.conf (symlinked into
# sites-enabled). This is the REAL serving vhost in prod. Kept here for version
# control / docs only; editing this repo file does NOT change the droplet.
# Managed/created by `certbot --apache`; the dev.html auth block was added by
# hand (see DROPLET.local.md). See DROPLET.md.
# ============================================================
<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerAdmin webmaster@isitbensbirthday.com
	ServerName isitbensbirthday.com
	ServerAlias www.isitbensbirthday.com
	DocumentRoot /opt/isitbensbirthday/site

	<Directory /opt/isitbensbirthday/site>
		Options -Indexes
		AllowOverride None
		Require all granted

		# Gate the dev-only console behind Basic Auth in prod. The :80→:443
		# redirect fires first, so credentials only ever travel over TLS.
		# Username 'ben'; the password lives in /etc/apache2/.htpasswd on the
		# droplet (bcrypt) — NOT in this repo. See DROPLET.local.md.
		<Files "dev.html">
			AuthType Basic
			AuthName "Ben's Dev Console"
			AuthUserFile /etc/apache2/.htpasswd
			Require valid-user
		</Files>
	</Directory>

	# In-character 404 (the site has no SPA fallback by design, so wrong paths
	# land here). Served with a 404 status.
	ErrorDocument 404 /404.html

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

SSLCertificateFile /etc/letsencrypt/live/isitbensbirthday.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/isitbensbirthday.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
