# ============================================================
# PRODUCTION REFERENCE — verbatim copy of the droplet's :443 vhost.
# Live path: /etc/apache2/sites-available/isitbensbirthday.com-le-ssl.conf
# (symlinked into sites-enabled). This is the REAL serving vhost in prod.
# Kept here for version control / docs only; editing this repo file does NOT
# change the droplet. Managed/created by `certbot --apache`. See DROPLET.md.
# ============================================================
<IfModule mod_ssl.c>
<VirtualHost *:443>
	ServerAdmin webmaster@isitbensbirthday.com
	ServerName isitbensbirthday.com
	ServerAlias www.isitbensbirthday.com
	DocumentRoot /opt/isitbensbirthday/site

	<Directory /opt/isitbensbirthday/site>
		Options -Indexes
		AllowOverride None
		Require all granted
	</Directory>
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

SSLCertificateFile /etc/letsencrypt/live/isitbensbirthday.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/isitbensbirthday.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
