# ============================================================
# 000-default.conf — LOCAL DEV Apache vhost (php:8.3-apache container)
#
# Deliberately mirrors the PRODUCTION serving behavior so dev == prod:
# Apache 2.4 serving the static site directory, gzip via the
# global mod_deflate config, and NO cache-control headers or SPA fallback
# (the droplet doesn't set those either — mod_headers/mod_expires aren't
# even enabled there).
#
# What can't be mirrored locally: the droplet's :80→:443 HTTPS redirect and
# the Let's Encrypt TLS vhost. Those live only on the droplet — see the
# verbatim copies in apache/prod-*.conf and the walkthrough in DROPLET.md.
#
# Prod DocumentRoot: /opt/isitbensbirthday/site
# Local DocumentRoot: /var/www/html (docker-compose mounts ./site here)
# ============================================================
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
