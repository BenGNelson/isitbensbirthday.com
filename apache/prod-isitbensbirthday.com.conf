# ============================================================
# PRODUCTION REFERENCE — verbatim copy of the droplet's :80 vhost.
# Live path: /etc/apache2/sites-available/isitbensbirthday.com.conf
# (symlinked into sites-enabled). Kept here for version control / docs only;
# editing this repo file does NOT change the droplet. See DROPLET.md.
#
# Purpose: redirect ALL http traffic to https. The real serving vhost is
# prod-isitbensbirthday.com-le-ssl.conf (:443).
# ============================================================
<VirtualHost *:80>
	ServerAdmin webmaster@isitbensbirthday.com
	ServerName isitbensbirthday.com
	ServerAlias www.isitbensbirthday.com
	DocumentRoot /opt/isitbensbirthday/site

	<Directory /opt/isitbensbirthday/site>
		Options -Indexes
		AllowOverride None
		Require all granted
	</Directory>
	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

RewriteEngine on
RewriteCond %{SERVER_NAME} =www.isitbensbirthday.com [OR]
RewriteCond %{SERVER_NAME} =isitbensbirthday.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
