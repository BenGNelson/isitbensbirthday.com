name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Static checks (JS syntax, router invariants, HTML sanity)
        run: ./scripts/test.sh --static
      - name: Secret / PII scan
        run: ./scripts/check-secrets.sh
