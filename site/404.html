<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Not Ben's Birthday</title>
  <meta name="robots" content="noindex">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg1: #eef2ff;
      --bg2: #fce7f3;
      --ink: #1f2937;
      --muted: #6b7280;
      --accent: #db2777;
      --card: rgba(255, 255, 255, 0.72);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #0f172a;
        --bg2: #1e1b4b;
        --ink: #f1f5f9;
        --muted: #94a3b8;
        --accent: #f472b6;
        --card: rgba(30, 41, 59, 0.6);
      }
    }

    html, body { min-height: 100vh; width: 100%; overflow-x: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      color: var(--ink);
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .wrap {
      max-width: 30rem;
      width: 100%;
      text-align: center;
      background: var(--card);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 1.5rem;
      padding: 3rem 2rem 2.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
    }

    .balloon {
      font-size: 4.5rem;
      line-height: 1;
      display: inline-block;
      filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.18));
      animation: bob 4s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50%      { transform: translateY(-14px) rotate(4deg); }
    }

    .code {
      font-size: clamp(3.5rem, 18vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0.75rem 0 0.25rem;
      color: var(--accent);
    }

    h1 {
      font-size: clamp(1.15rem, 5vw, 1.5rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 1.75rem;
    }

    a.home {
      display: inline-block;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 8px 20px rgba(219, 39, 96, 0.35);
    }
    a.home:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(219, 39, 96, 0.45); }

    .wink {
      margin-top: 1.75rem;
      font-size: 0.8rem;
      color: var(--muted);
      opacity: 0.8;
    }

    @media (prefers-reduced-motion: reduce) {
      .balloon { animation: none; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="balloon" aria-hidden="true">🎈</div>
    <div class="code">404</div>
    <h1>This page is not Ben&rsquo;s birthday either.</h1>
    <p>You&rsquo;ve wandered off the calendar. There&rsquo;s nothing here &mdash;
       much like most days of the year.</p>
    <a class="home" href="/">&larr; Back to the calendar</a>
    <div class="wink">If you were looking for the birthday, try again on July&nbsp;5th.</div>
  </main>
</body>
</html>
